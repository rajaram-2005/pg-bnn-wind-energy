[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "windfusion-lite"
version = "0.1.0"
description = "Lightweight physics-confidence fusion for wind turbine predictive maintenance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "torch>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4", "ruff>=0.6"]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
baselines = ["scikit-learn>=1.3"]

[project.scripts]
windfusion = "windfusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["windfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
